<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주유소 데이터 도구</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./launch.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"></span>주유소 데이터 도구</a>
      <span class="local-status"><span></span> 오프라인 실행</span>
    </div>
  </header>
  <main class="shell">
    <section id="home" aria-labelledby="home-title">
      <div class="intro">
        <h1 id="home-title">주유소 위치와 판매가격</h1>
      </div>
      <div class="hero-stage">
        <p class="hero-copy">지역을 골라 주유소 위치와 판매가격을 CSV로 저장하세요. 지도에서는 주유소별 가격을 날짜에 따라 확인할 수 있습니다.</p>
        <div class="hero-image">
          <img src="./fuel-pump.png" width="1254" height="1254" alt="">
        </div>
        <aside class="format-tile" aria-label="지원 파일 형식">
          <span>지원 파일 형식</span>
          <dl>
            <div><dt>CSV</dt><dd>위치 · 판매가격</dd></div>
            <div><dt>GeoJSON</dt><dd>행정동 경계</dd></div>
          </dl>
        </aside>
      </div>
      <nav class="menu" aria-label="주 메뉴">
        <a class="menu-card" href="/extract">
          <h2>지역별 CSV 추출</h2>
          <p>시도와 시·군·구를 선택해 위치와 판매가격을 각각 저장합니다.</p>
          <span class="menu-action">CSV 추출 열기</span>
        </a>
        <a class="menu-card" href="/lookup">
          <h2>주유소 지도·가격 조회</h2>
          <p>지역 지도에서 주유소를 선택하고 날짜별·유종별 판매가격을 조회합니다.</p>
          <span class="menu-action">지도·가격 조회 열기</span>
        </a>
      </nav>
    </section>
    <section id="workspace" hidden aria-labelledby="workspace-title">
      <a class="back" href="/">메인으로</a>
      <h1 id="workspace-title" tabindex="-1"></h1>
      <div id="form"></div>
      <div id="results" hidden></div>
    </section>
  </main>
  <template id="form-template">
    <section class="panel controls" aria-label="CSV 입력과 지역 선택">
      <div class="source-controls">
        <button type="button" class="button" data-source>기본 CSV 불러오기</button>
        <p class="secondary">기본 주유소 위치와 판매가격 데이터를 불러옵니다. 다른 CSV는 아래에서 선택하세요.</p>
      </div>
      <div class="input-grid">
        <label>주유소 위치 CSV<input type="file" accept=".csv,text/csv" data-file="location"><span class="file-status" data-status="location" aria-live="polite"></span></label>
        <label>주유소 판매가격 CSV<input type="file" accept=".csv,text/csv" data-file="price"><span class="file-status" data-status="price" aria-live="polite"></span></label>
      </div>
      <div class="region-grid">
        <label>시도<select data-region="province" disabled></select></label>
        <label>시·군·구<select data-region="district" disabled></select></label>
      </div>
      <p class="status" data-summary role="status">두 CSV를 업로드하면 지역을 선택할 수 있습니다.</p>
    </section>
  </template>
</body>
</html>
